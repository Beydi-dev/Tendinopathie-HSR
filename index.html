<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genoux HSR</title>
<meta name="theme-color" content="#2A4FC9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Genoux HSR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="app"></div>

  <!-- L'ordre compte : app.js utilise Engine, défini dans engine.js -->
  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script>
    // Service worker : l'app s'ouvre même sans réseau
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    // Demande au navigateur de ne pas effacer les données en cas de manque de place
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  </script>
</body>
</html>
